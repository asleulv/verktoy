version: '3.8'

services:
  verktoy:
    build: .
    container_name: verktoy
    restart: always
    environment:
      - VIRTUAL_HOST=verktoy.asle.dev
      - LETSENCRYPT_HOST=verktoy.asle.dev
      - VIRTUAL_PORT=80
    networks:
      - nginx-proxy-network

networks:
  nginx-proxy-network:
    external: true
