<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabellvisning | Sjå datafiler oversiktleg</title>
    <meta name="description"
        content="Les tabell-data som CSV, TSV, JSON og Excel enkelt og oversiktleg i nettlesaren. 100% privat.">

    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Theme script -->
    <script src="../theme.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Data Parsers -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="top-bar">
        <a href="../index.html" class="back-link">
            <i data-lucide="arrow-left"></i>
            <span>Tilbake til oversikt</span>
        </a>
        <button class="theme-toggle-btn" type="button" aria-label="Bytt tema">
            <span class="theme-icon-container">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon-svg"><path d="M12 3a6 6 0 0 0 9 9 9 0 1 1-9-9Z"/></svg>
            </span>
            <span class="theme-text">NATT</span>
        </button>
    </div>

    <main class="app-container">
        <header>
            <div class="logo-area">
                <i data-lucide="table-2" class="main-icon"></i>
                <h1>Tabellvisning</h1>
            </div>
            <p class="subtitle">Gjer uoversiktlege datafiler om til tydelege, søkbare tabellar. Støttar CSV, TSV, JSON og Excel.</p>
        </header>

        <!-- Step 1: Upload -->
        <section id="upload-section" class="card active">
            <div class="drop-zone" id="drop-zone">
                <input type="file" id="file-input" accept=".csv,.json,.xlsx,.xls,.ods,.tsv,.txt" hidden>
                <div class="drop-content">
                    <i data-lucide="file-spreadsheet" class="upload-icon"></i>
                    <h3>Slepp fila di her</h3>
                    <p>Eller klikk for å velge CSV, JSON eller Excel</p>
                </div>
            </div>
        </section>

        <!-- Step 2: Table Viewer -->
        <section id="viewer-section" class="card hidden">
            <div class="table-controls">
                <div class="search-box">
                    <i data-lucide="search"></i>
                    <input type="text" id="search-input" placeholder="Søk i rader...">
                </div>
                <div id="status-msg" class="status-msg hidden"></div>
                <div class="stats-badge">
                    <span id="row-count">0</span> rader funne
                </div>
                <div class="actions">
                    <button id="reset-btn" class="btn-secondary btn-small">
                        <i data-lucide="file-plus"></i> Ny fil
                    </button>
                </div>
            </div>

            <div class="table-container">
                <div class="table-scroll" id="table-scroll">
                    <table id="data-table">
                        <thead>
                            <tr id="table-header"></tr>
                        </thead>
                        <tbody id="table-body">
                            <!-- Rows injected here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="no-results" class="hidden">
                <p>Ingen resultat som passar søket ditt.</p>
            </div>
            
            <div class="pagination" id="pagination">
                <button id="prev-page" class="btn-page"><i data-lucide="chevron-left"></i></button>
                <span id="page-info">Side 1 av 1</span>
                <button id="next-page" class="btn-page"><i data-lucide="chevron-right"></i></button>
            </div>
        </section>

        <footer>
            <p class="copyright">&copy; 2026 verktøy • asle.dev</p>
        </footer>
    </main>

    <script src="skript.js"></script>
</body>

</html>
