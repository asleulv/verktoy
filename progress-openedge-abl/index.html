<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress OpenEdge ABL Hjelpar | Syntax & Eksempel</title>
    <meta name="description"
        content="Hjelpverktøy for Progress OpenEdge ABL: Søkbar oversikt over kommandoar, datatypar og syntax-eksempel.">

    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Theme script -->
    <script src="../theme.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="top-bar">
        <a href="../index.html" class="back-link">
            <i data-lucide="arrow-left"></i>
            <span>Tilbake til oversikt</span>
        </a>
        <button class="theme-toggle-btn" type="button" aria-label="Bytt tema">
            <span class="theme-icon-container">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon-svg"><path d="M12 3a6 6 0 0 0 9 9 9 0 1 1-9-9Z"/></svg>
            </span>
            <span class="theme-text">NATT</span>
        </button>
    </div>

    <main class="app-container">
        <header>
            <div class="logo-area">
                <i data-lucide="code-2" class="main-icon"></i>
                <h1>ABL-hjelpar</h1>
            </div>
            <p class="subtitle">Søkbar referanse for Progress OpenEdge ABL. Finn syntax, kategoriar og praktiske kodeeksempel på sekundet.</p>
        </header>

        <section class="card active">
            <div class="cmd-toolbar">
                <div class="search-box">
                    <i data-lucide="search"></i>
                    <input type="text" id="cmd-search"
                        placeholder="Søk i kommandoar (t.d. 'variable', 'temp-table', 'find')...">
                </div>
                
                <div class="category-filter" id="category-filter">
                    <!-- Categories will be injected here -->
                </div>
            </div>

            <div class="cmd-list" id="cmd-list">
                <!-- Commands injected here -->
            </div>
        </section>

        <footer>
            <p class="copyright">&copy; 2026 verktøy • asle.dev</p>
        </footer>
    </main>

    <script src="abl-commands.js"></script>
    <script src="skript.js"></script>
</body>

</html>
