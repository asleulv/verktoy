<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress OpenEdge ABL Hjelpar | Syntax & Eksempel</title>
    <meta name="description"
        content="Hjelpverktøy for Progress OpenEdge ABL: Søkbar oversikt over kommandoar, datatypar og syntax-eksempel.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="glass-background"></div>

    <main class="app-container">
        <header>
            <div class="nav-back">
                <a href="../index.html" class="back-link">
                    <i data-lucide="arrow-left"></i>
                    <span>Alle verktøy</span>
                </a>
            </div>
            <div class="logo-area">
                <i data-lucide="code-2" class="main-icon pulse-soft"></i>
                <h1>ABL-hjelpar</h1>
            </div>
            <p class="subtitle">Søkbar referanse for Progress OpenEdge ABL. Finn syntax, kategoriar og praktiske kodeeksempel på sekundet.</p>
        </header>

        <section class="card active">
            <div class="cmd-toolbar">
                <div class="search-box">
                    <i data-lucide="search"></i>
                    <input type="text" id="cmd-search"
                        placeholder="Søk i kommandoar (t.d. 'variable', 'temp-table', 'find')...">
                </div>
                
                <div class="category-filter" id="category-filter">
                    <!-- Categories will be injected here -->
                </div>
            </div>

            <div class="cmd-list" id="cmd-list">
                <!-- Commands injected here -->
            </div>
        </section>

        <footer>
            <div class="privacy-badge">
                <i data-lucide="shield-check"></i>
                <span>100% lokalt: Ingenting forlet maskina di.</span>
            </div>
            <p class="copyright">&copy; 2026 verktøy • asle.dev</p>
        </footer>
    </main>

    <script src="abl-commands.js"></script>
    <script src="skript.js"></script>
</body>

</html>
